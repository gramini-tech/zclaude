name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "1"

jobs:
  lint:
    # The lint toolchain (ESLint 10 and its plugins) needs Node 22+; the
    # runtime itself supports Node 20.17+, which the test matrix covers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: npm ci
      - run: npm run lint
      # The vsix is a committed build artefact; this is what notices when it
      # falls behind its sources.
      - run: npm run check:extension
      - run: npm audit --omit=dev --audit-level=high

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Coverage thresholds need Node 22.8+; Node 20 runs the same tests without the gate.
      - run: ${{ matrix.node == '20' && 'npm test' || 'npm run test:coverage' }}
      - run: ./zclaude --help
      - run: npm pack --dry-run
